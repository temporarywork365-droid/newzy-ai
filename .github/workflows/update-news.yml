name: Update AI news (Gemini pipeline)

on:
  schedule:
    # Every 15 minutes, so a big story shows up in the app within about 15-30 minutes.
    # Odd minutes on purpose: GitHub delays or drops jobs scheduled exactly at the top of the hour.
    # GitHub runs schedules on a best-effort basis, so a run can start a few minutes late.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

# Never run two updates at the same time (they would both try to commit).
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the news pipeline (one more try if Gemini is overloaded)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2; do
            if node scripts/generate-news.mjs; then
              exit 0
            fi
            echo "Pipeline attempt $attempt failed."
            if [ "$attempt" -lt 2 ]; then
              echo "Waiting 2 minutes before trying again..."
              sleep 120
            fi
          done
          echo "Both attempts failed. The next scheduled run will try again."
          exit 1

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "newzy-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/live
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: AI news update [skip ci]"
            # If you pushed code while this job was running, pick up your commits first.
            git pull --rebase origin main
            git push
          fi
