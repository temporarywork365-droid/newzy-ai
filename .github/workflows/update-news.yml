name: Update AI news (Gemini pipeline)

on:
  schedule:
    # 02:00 UTC = 07:30 IST — runs once a day.
    - cron: '0 2 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the news pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-news.mjs

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "newzy-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live/articles.json data/live/digest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily AI news update [skip ci]"
            git push
          fi
